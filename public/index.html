<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatter — Real-Time Chat</title>
  <meta name="description" content="A lightweight, responsive real-time web chat application built with Node.js and Socket.IO.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Initial Username Entry Modal Overlay -->
  <div id="username-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="brand-badge">
          <span class="brand-icon" aria-hidden="true">
            <!-- Lucide message-square SVG -->
            <svg class="lucide lucide-message-square" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </span>
        </div>
        <h1 id="modal-title" class="modal-title">Welcome to Chatter</h1>
        <p class="modal-subtitle">Enter a display name to join the conversation.</p>
      </div>

      <form id="username-form" class="modal-form" novalidate>
        <div class="input-group">
          <label for="username-input" class="sr-only">Username</label>
          <input
            type="text"
            id="username-input"
            class="form-input"
            placeholder="Choose a username (1–25 characters)"
            maxlength="25"
            autocomplete="off"
            required
            autofocus
          >
          <div id="username-error" class="form-error" role="alert" aria-live="assertive"></div>
        </div>

        <button type="submit" id="join-btn" class="btn btn-primary btn-block">
          Join Chat
        </button>
      </form>
    </div>
  </div>

  <!-- Main Chat Application Container -->
  <div id="app" class="chat-app">
    <!-- Chat Header -->
    <header class="chat-header">
      <div class="header-left">
        <button
          id="sidebar-toggle-btn"
          class="btn-icon sidebar-toggle-btn"
          type="button"
          aria-label="Open online users roster"
          aria-expanded="false"
          aria-controls="users-sidebar"
          title="Open online users"
        >
          <span id="sidebar-toggle-icon" class="sidebar-toggle-icon" aria-hidden="true">
            <!-- Lucide menu SVG -->
            <svg class="lucide lucide-menu" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </span>
        </button>
        <div class="header-title-group">
          <div class="brand-title">
            <span class="brand-logo-badge" aria-hidden="true">
              <svg class="brand-logo-icon lucide lucide-message-square" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <span class="brand-logo-text">Chatter</span>
            <span class="room-pill">#general</span>
          </div>
          <p class="room-topic">Real-time public chat room</p>
        </div>
      </div>
      <div class="header-right">
        <div id="user-count-badge" class="user-count-badge" aria-live="polite">
          <span class="status-dot online" aria-hidden="true"></span>
          <span class="user-count-icon" aria-hidden="true">
            <!-- Lucide users SVG -->
            <svg class="lucide lucide-users" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span id="user-count-text">0 online</span>
        </div>
        <button
          id="theme-toggle-btn"
          class="btn-icon theme-toggle-btn"
          type="button"
          aria-label="Switch to light theme"
          title="Switch to light theme"
        >
          <span id="theme-toggle-icon" class="theme-icon" aria-hidden="true">
            <!-- Lucide sun SVG (initial dark mode) -->
            <svg class="lucide lucide-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Main Chat Layout (Sidebar + Chat Area) -->
    <div class="chat-main-container">
      <!-- Mobile Drawer Backdrop Overlay -->
      <div id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

      <!-- Online Users Sidebar -->
      <aside id="users-sidebar" class="users-sidebar" aria-label="Online Users" aria-hidden="true">
        <div class="sidebar-header">
          <div class="sidebar-header-left">
            <h2 class="sidebar-title">Online Users</h2>
            <span id="sidebar-user-count" class="badge">0</span>
          </div>
          <button
            id="sidebar-close-btn"
            class="btn-icon sidebar-close-btn"
            type="button"
            aria-label="Close online users roster"
            title="Close online users"
          >
            <span aria-hidden="true">
              <!-- Lucide x SVG -->
              <svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </span>
          </button>
        </div>
        <div class="sidebar-content">
          <ul id="users-list" class="users-list" role="list">
            <!-- User items dynamically rendered by ui.js -->
          </ul>
        </div>
      </aside>

      <!-- Chat Area -->
      <section class="chat-area">
        <!-- Real-Time Connection Status Banner -->
        <div id="connection-status" class="connection-status hidden" role="status" aria-live="polite">
          <div class="connection-status-content">
            <span id="connection-status-dot" class="status-dot warning" aria-hidden="true"></span>
            <span id="connection-status-text" class="connection-status-text">Connecting to server...</span>
          </div>
        </div>

        <!-- Chat Messages Stream -->
        <main id="messages-container" class="messages-container" tabindex="0">
          <div id="messages-list" class="messages-list" role="log" aria-live="polite">
            <!-- Messages dynamically rendered by ui.js -->
          </div>
        </main>

        <!-- Floating Scroll-to-Bottom / New Messages Jump Button -->
        <button
          id="scroll-bottom-btn"
          class="scroll-bottom-btn hidden"
          type="button"
          aria-label="Scroll to newest messages"
        >
          <span class="btn-icon-svg" aria-hidden="true">
            <!-- Lucide arrow-down SVG -->
            <svg class="lucide lucide-arrow-down" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
          </span>
          <span id="scroll-bottom-text" class="scroll-bottom-text">New messages below</span>
        </button>

        <!-- Typing Activity Indicator Banner -->
        <div id="typing-indicator" class="typing-indicator hidden" aria-live="polite">
          <div class="typing-indicator-content">
            <span class="typing-dots" aria-hidden="true">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </span>
            <span id="typing-text" class="typing-text"></span>
          </div>
        </div>

        <!-- Chat Input Footer with Emoji Quick-Picker & Character Counter -->
        <footer class="chat-footer">
          <!-- Emoji Quick-Picker Popover Dialog -->
          <div
            id="emoji-picker"
            class="emoji-picker hidden"
            role="dialog"
            aria-label="Emoji picker"
            aria-hidden="true"
          >
            <div class="emoji-picker-header">
              <span class="emoji-picker-title">Quick Emojis</span>
            </div>
            <div id="emoji-grid" class="emoji-grid" role="grid">
              <!-- Dynamically populated by emoji.js -->
            </div>
          </div>

          <form id="message-form" class="chat-input-form" novalidate>
            <div class="input-wrapper">
              <label for="message-input" class="sr-only">Message</label>
              <input
                type="text"
                id="message-input"
                class="chat-input"
                placeholder="Type a message..."
                maxlength="500"
                autocomplete="off"
                required
              >

              <button
                id="emoji-toggle-btn"
                class="btn-icon emoji-toggle-btn"
                type="button"
                aria-label="Open emoji picker"
                aria-expanded="false"
                aria-controls="emoji-picker"
                title="Choose emoji"
              >
                <span id="emoji-toggle-icon" class="btn-icon-svg" aria-hidden="true">
                  <!-- Lucide smile SVG -->
                  <svg class="lucide lucide-smile" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
                </span>
              </button>

              <!-- Live Character Counter -->
              <span id="char-counter" class="char-counter" aria-live="polite" aria-atomic="true">0/500</span>
            </div>

            <button type="submit" id="send-btn" class="btn btn-send" aria-label="Send message" title="Send message">
              <span class="btn-icon-svg" aria-hidden="true">
                <!-- Lucide send SVG -->
                <svg class="lucide lucide-send" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
              </span>
              <span class="send-btn-text">Send</span>
            </button>
          </form>
        </footer>
      </section>
    </div>
  </div>

  <!-- Socket.IO client library (served by Express backend) -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Modular Client Architecture Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/emoji.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
